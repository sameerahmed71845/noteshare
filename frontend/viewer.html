<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>PDF Viewer ⚡</title>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap"
rel="stylesheet">

<style>

*{

margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;

}

body{

background:
radial-gradient(circle at top left,#00ffee22,transparent 30%),
radial-gradient(circle at bottom right,#b700ff22,transparent 30%),
#030712;

color:white;

height:100vh;

overflow:hidden;

}

/* NAVBAR */

.nav{

padding:15px 20px;

display:flex;

justify-content:space-between;

align-items:center;

background:rgba(255,255,255,.05);

backdrop-filter:blur(18px);

border-bottom:

1px solid rgba(255,255,255,.08);

}

.logo{

font-size:28px;

font-weight:800;

background:

linear-gradient(
90deg,
#00ffee,
#8a6dff
);

-webkit-background-clip:text;

-webkit-text-fill-color:transparent;

}

.buttons{

display:flex;

gap:10px;

flex-wrap:wrap;

}

button{

padding:10px 15px;

border:none;

border-radius:12px;

cursor:pointer;

font-size:14px;

font-weight:700;

background:

rgba(
255,
255,
255,
0.08
);

color:white;

transition:.3s;

}

button:hover{

transform:translateY(-2px);

box-shadow:

0 0 15px cyan;

}

#viewer{

width:100%;

height:

calc(100vh - 70px);

border:none;

background:white;

}

/* MOBILE */

@media(max-width:700px){

.logo{

font-size:22px;

}

button{

font-size:12px;

padding:8px 10px;

}

}

</style>

</head>

<body>

<div class="nav">

<div class="logo">

⚡ NoteShare

</div>

<div class="buttons">

<button onclick="downloadPDF()">

📥 Download

</button>

<button onclick="goBack()">

⬅ Back

</button>

</div>

</div>

<iframe
id="viewer">
</iframe>

<script>

const params =
new URLSearchParams(
window.location.search
);

const pdfUrl =
params.get("pdf");

const viewer =
document.getElementById(
"viewer"
);

if(pdfUrl){

viewer.src=pdfUrl;

}else{

alert(
"PDF not found"
);

}

function downloadPDF(){

window.open(
pdfUrl,
"_blank"
);

}

function goBack(){

history.back();

}

</script>

</body>

</html>
