<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Upload Notes ⚡</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

html{
    scroll-behavior:smooth;
}

body{

    min-height:100vh;

    overflow-x:hidden;
    overflow-y:auto;

    background:
    radial-gradient(circle at top left,#00ffe11f,transparent 30%),
    radial-gradient(circle at bottom right,#b700ff22,transparent 30%),
    #030712;

    color:white;

    position:relative;
}

/* GRID */

body::before{

    content:'';

    position:fixed;

    width:100%;
    height:100%;

    background-image:
    linear-gradient(rgba(255,255,255,0.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,0.03) 1px,transparent 1px);

    background-size:40px 40px;

    z-index:-2;
}

/* CURSOR */

.cursor{

    width:22px;
    height:22px;

    border-radius:50%;

    background:rgba(0,255,255,0.8);

    position:fixed;

    pointer-events:none;

    transform:translate(-50%,-50%);

    mix-blend-mode:screen;

    box-shadow:
    0 0 20px cyan,
    0 0 40px cyan;

    z-index:9999;
}

/* PARTICLES */

.particles span{

    position:absolute;

    width:4px;
    height:4px;

    background:#00f7ff;

    border-radius:50%;

    animation:float 10s linear infinite;

    opacity:0.7;
}

@keyframes float{

    0%{
        transform:translateY(0px);
    }

    100%{
        transform:translateY(-100vh);
    }
}

/* CONTAINER */

.container{
    width:100%;
    padding:40px 8%;
}

/* NAVBAR */

.navbar{

    width:100%;

    padding:22px 40px;

    border-radius:30px;

    backdrop-filter:blur(18px);

    background:rgba(255,255,255,0.04);

    border:1px solid rgba(255,255,255,0.08);

    display:flex;

    justify-content:space-between;

    align-items:center;

    box-shadow:0 0 30px rgba(0,255,255,0.08);
}

.logo{

    font-size:2rem;

    font-weight:700;

    background:linear-gradient(to right,#00f5ff,#c26bff);

    -webkit-background-clip:text;

    -webkit-text-fill-color:transparent;
}

.nav-links{

    display:flex;

    gap:35px;
}

.nav-links a{

    color:white;

    text-decoration:none;

    transition:0.3s;
}

.nav-links a:hover{
    color:#00f5ff;
}

/* HERO */

.hero{

    min-height:85vh;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:50px 0;
}

/* CARD */

.upload-card{

    width:100%;

    max-width:720px;

    padding:50px;

    border-radius:35px;

    backdrop-filter:blur(18px);

    background:rgba(255,255,255,0.04);

    border:1px solid rgba(255,255,255,0.08);

    box-shadow:0 0 40px rgba(0,255,255,0.1);

    position:relative;

    overflow:hidden;
}

.upload-card::before{

    content:'';

    position:absolute;

    width:220px;
    height:220px;

    background:#00ffee22;

    border-radius:50%;

    top:-80px;
    right:-80px;

    filter:blur(50px);
}

.upload-card h1{

    text-align:center;

    font-size:3.5rem;

    margin-bottom:15px;

    background:linear-gradient(to right,#00ffe7,#6ea8ff,#ff7ad9);

    -webkit-background-clip:text;

    -webkit-text-fill-color:transparent;
}

.upload-card p{

    text-align:center;

    opacity:0.8;

    margin-bottom:40px;

    line-height:1.8;
}

/* CLOCK */

#clock{

    text-align:center;

    margin-bottom:30px;

    opacity:0.7;

    letter-spacing:2px;
}

/* INPUTS */

.input-box{
    margin-bottom:28px;
}

.input-box label{

    display:block;

    margin-bottom:10px;

    color:#cfcfcf;
}

.input-box input{

    width:100%;

    padding:18px 20px;

    border:none;

    outline:none;

    border-radius:18px;

    background:rgba(255,255,255,0.05);

    border:1px solid rgba(255,255,255,0.08);

    color:white;

    font-size:1rem;

    transition:0.4s;
}

.input-box input:focus{

    border:1px solid #00ffee;

    box-shadow:0 0 20px #00ffee44;
}

/* FILE BOX */

.file-box{

    border:2px dashed rgba(255,255,255,0.15);

    padding:40px;

    border-radius:25px;

    text-align:center;

    cursor:pointer;

    background:rgba(255,255,255,0.03);

    transition:0.4s;
}

.file-box:hover{

    border-color:#00ffee;

    box-shadow:0 0 25px #00ffee33;
}

.file-box input{
    display:none;
}

.file-box h3{
    margin-top:15px;
}

.file-name{

    margin-top:15px;

    color:#00ffee;

    font-size:0.95rem;
}

/* BUTTON */

.upload-btn{

    width:100%;

    margin-top:35px;

    padding:18px;

    border:none;

    border-radius:18px;

    cursor:pointer;

    font-size:1.1rem;

    font-weight:700;

    color:white;

    background:linear-gradient(135deg,#00f7ff33,#00ffae33);

    border:1px solid #00ffee88;

    box-shadow:0 0 25px #00ffee33;

    transition:0.4s;
}

.upload-btn:hover{

    transform:translateY(-5px);

    box-shadow:0 0 40px #00ffee88;
}

/* STATUS */

.status{

    margin-top:25px;

    text-align:center;

    font-size:1rem;

    color:#00ffee;
}

/* FOOTER */

.footer{

    text-align:center;

    opacity:0.6;

    padding-bottom:40px;
}

/* RESPONSIVE */

@media(max-width:768px){

    .upload-card{
        padding:35px 25px;
    }

    .upload-card h1{
        font-size:2.5rem;
    }

    .navbar{

        flex-direction:column;

        gap:20px;
    }

    .nav-links{
        gap:18px;
    }

}

</style>

</head>

<body>

<!-- CURSOR -->

<div class="cursor"></div>

<!-- PARTICLES -->

<div class="particles">

<span style="left:5%; top:90%; animation-duration:12s;"></span>

<span style="left:15%; top:80%; animation-duration:15s;"></span>

<span style="left:30%; top:95%; animation-duration:10s;"></span>

<span style="left:45%; top:88%; animation-duration:17s;"></span>

<span style="left:60%; top:92%; animation-duration:11s;"></span>

<span style="left:75%; top:85%; animation-duration:16s;"></span>

<span style="left:90%; top:95%; animation-duration:13s;"></span>

</div>

<div class="container">

<!-- NAVBAR -->

<div class="navbar">

<div class="logo">
⚡ NoteShare
</div>

<div class="nav-links">

<a href="index.html">Home</a>

<a href="upload.html">Upload</a>

<a href="notes.html">Browse</a>

</div>

</div>

<!-- HERO -->

<div class="hero">

<div class="upload-card">

<h1>
Upload Notes ⚡
</h1>

<p>
Share your study materials with the futuristic NoteShare community.
</p>

<div id="clock"></div>

<form id="uploadForm">

<div class="input-box">

<label>
📘 Note Title
</label>

<input
type="text"
id="title"
placeholder="Enter note title..."
required>

</div>

<div class="input-box">

<label>
🧠 Subject
</label>

<input
type="text"
id="subject"
placeholder="Enter subject..."
required>

</div>

<div
class="file-box"
onclick="document.getElementById('pdf').click()">

<input
type="file"
id="pdf"
accept=".pdf"
required>

<div style="font-size:3rem;">
📄
</div>

<h3>
Click to Upload PDF
</h3>

<div class="file-name" id="fileName">
No file selected
</div>

</div>

<button
type="submit"
class="upload-btn">

🚀 Upload Note

</button>

<div class="status" id="status"></div>

</form>

</div>

</div>

<div class="footer">
Made with ⚡ by Sameer
</div>

</div>

<script>

/* CLOCK */

function updateClock(){

const now = new Date();

const date = now.toLocaleDateString();

const time = now.toLocaleTimeString();

document.getElementById("clock").innerHTML =
`${date} • ${time}`;

}

setInterval(updateClock,1000);

updateClock();

/* CURSOR */

const cursor =
document.querySelector(".cursor");

document.addEventListener("mousemove",(e)=>{

cursor.style.left =
e.clientX + "px";

cursor.style.top =
e.clientY + "px";

});

/* FILE NAME */

const pdfInput =
document.getElementById("pdf");

pdfInput.addEventListener("change",()=>{

const file =
pdfInput.files[0];

if(file){

document.getElementById("fileName").innerHTML =
file.name;

}

});

/* FORM */

document.getElementById("uploadForm")
.addEventListener("submit",async(e)=>{

e.preventDefault();

const title =
document.getElementById("title").value;

const subject =
document.getElementById("subject").value;

const pdf =
document.getElementById("pdf").files[0];

const formData =
new FormData();

formData.append("title",title);

formData.append("subject",subject);

formData.append("pdf",pdf);

const status =
document.getElementById("status");

status.innerHTML =
"Uploading... ⚡";

try{

const API =
"https://noteshare-o50k.onrender.com";

const res =
await fetch(

`${API}/upload-note`,

{
method:"POST",
body:formData
}

);

const data =
await res.json();

if(!res.ok){

throw new Error(
data.error ||
"Upload Failed"
);

}

status.innerHTML =
"✅ Note Uploaded Successfully";

document
.getElementById(
"uploadForm"
)
.reset();

document
.getElementById(
"fileName"
)
innerHTML =
"No file selected";

}
catch(err){

console.log(err);

status.innerHTML =
"❌ Upload Failed";

}
</script>

</body>
</html>
