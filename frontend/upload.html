<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0">

<title>
Upload Notes ⚡
</title>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap"
rel="stylesheet">

<style>

*{

margin:0;
padding:0;

box-sizing:border-box;

font-family:Poppins,sans-serif;

}

body{

background:
#030712;

background-image:

linear-gradient(
rgba(255,255,255,0.03) 1px,
transparent 1px
),

linear-gradient(
90deg,
rgba(255,255,255,0.03) 1px,
transparent 1px
);

background-size:40px 40px;

color:white;

min-height:100vh;

overflow-x:hidden;

}

.container{

max-width:700px;

margin:auto;

padding:25px;

}

.card{

margin-top:40px;

padding:35px;

background:

rgba(255,255,255,0.04);

border:

1px solid rgba(
255,
255,
255,
0.08
);

backdrop-filter:

blur(18px);

border-radius:30px;

box-shadow:

0 0 30px rgba(
0,
255,
255,
0.08
);

}

h1{

text-align:center;

margin-bottom:10px;

font-size:38px;

background:

linear-gradient(
90deg,
cyan,
violet
);

background-clip:text;

-webkit-background-clip:text;

-webkit-text-fill-color:transparent;

}

p{

text-align:center;

opacity:.8;

margin-bottom:25px;

}

label{

display:block;

margin-bottom:10px;

font-size:18px;

}

input{

width:100%;

padding:18px;

border:none;

outline:none;

border-radius:18px;

background:

rgba(
255,
255,
255,
0.06
);

color:white;

margin-bottom:22px;

font-size:16px;

}

.fileBox{

padding:50px;

border:

2px dashed rgba(
255,
255,
255,
0.12
);

border-radius:25px;

text-align:center;

cursor:pointer;

transition:.3s;

}

.fileBox:hover{

border-color:

cyan;

}

#pdf{

display:none;

}

#fileName{

margin-top:18px;

color:cyan;

word-break:break-word;

}

button{

width:100%;

padding:18px;

margin-top:25px;

border:none;

border-radius:18px;

background:

linear-gradient(
90deg,
#00ffee,
#00a6ff
);

color:black;

font-weight:700;

font-size:18px;

cursor:pointer;

}

button:hover{

opacity:.9;

}

#status{

text-align:center;

margin-top:20px;

font-size:18px;

}

.footer{

text-align:center;

margin-top:25px;

opacity:.6;

}

@media(max-width:600px){

.card{

padding:25px;

}

h1{

font-size:28px;

}

.fileBox{

padding:35px;

}

}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h1>
⚡ Upload Notes
</h1>

<p>
Share notes with NoteShare
</p>

<form
id="uploadForm">

<label>

📘 Note Title

</label>

<input
id="title"
required>

<label>

🧠 Subject

</label>

<input
id="subject"
required>

<div
class="fileBox"
onclick="pdf.click()">

<div
style="font-size:60px">

📄

</div>

<h2>

Click To Upload PDF

</h2>

<div
id="fileName">

No file selected

</div>

<input
type="file"
id="pdf"
accept=".pdf"
required>

</div>

<button>

🚀 Upload Note

</button>

<div
id="status">

</div>

</form>

</div>

<div
class="footer">

Made with ⚡ by Sameer

</div>

</div>

<script>

const API=

"https://noteshare-o50k.onrender.com";

const pdf=

document.getElementById(
"pdf"
);

pdf.addEventListener(
"change",
()=>{

const file=

pdf.files[0];

document.getElementById(
"fileName"
).innerHTML=

file?

file.name:

"No file selected";

}
);

document
.getElementById(
"uploadForm"
)

.addEventListener(
"submit",

async(e)=>{

e.preventDefault();

const status=

document.getElementById(
"status"
);

const formData=

new FormData();

formData.append(

"title",

document
.getElementById(
"title"
).value

);

formData.append(

"subject",

document
.getElementById(
"subject"
).value

);

formData.append(

"pdf",

pdf.files[0]

);

status.innerHTML=

"Uploading... ⚡";

try{

const res=

await fetch(

`${API}/upload-note`,

{

method:"POST",

body:formData

}

);

const data=

await res.json();

if(!res.ok){

throw new Error();

}

status.innerHTML=

"✅ Uploaded Successfully";

document
.getElementById(
"uploadForm"
)
.reset();

document
.getElementById(
"fileName"
)
innerHTML=

"No file selected";

}

catch{

status.innerHTML=

"❌ Upload Failed";

}

}

);

</script>

</body>

</html>
