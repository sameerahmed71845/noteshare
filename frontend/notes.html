<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0">

<title>NoteShare ⚡</title>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{

background:

radial-gradient(circle at top left,#00ffee22,transparent 30%),
radial-gradient(circle at bottom right,#9d00ff22,transparent 30%),
#030712;

color:white;

min-height:100vh;

padding:40px;

overflow-x:hidden;

}

/* NAV */

.nav{

display:flex;

justify-content:space-between;

align-items:center;

padding:25px;

border-radius:25px;

background:

rgba(255,255,255,0.05);

backdrop-filter:

blur(20px);

border:

1px solid rgba(255,255,255,.08);

margin-bottom:40px;

}

.logo{

font-size:32px;

font-weight:800;

background:

linear-gradient(
90deg,
cyan,
violet
);

-webkit-background-clip:text;

-webkit-text-fill-color:transparent;

}

/* HERO */

.hero{

text-align:center;

margin-bottom:50px;

}

.hero h1{

font-size:70px;

background:

linear-gradient(
90deg,
#00ffee,
#70a5ff,
#ff6ddf
);

-webkit-background-clip:text;

-webkit-text-fill-color:transparent;

}

.hero p{

opacity:.7;

margin-top:10px;

}

#clock{

margin-top:15px;

opacity:.6;

}

/* SEARCH */

.search{

display:flex;

justify-content:center;

margin-top:25px;

}

.search input{

width:500px;

padding:18px;

border:none;

outline:none;

border-radius:20px;

background:

rgba(255,255,255,.06);

color:white;

font-size:16px;

}

/* GRID */

.notes{

display:grid;

grid-template-columns:

repeat(
auto-fit,
minmax(320px,1fr)
);

gap:30px;

margin-top:40px;

}

/* CARD */

.card{

background:

rgba(255,255,255,.05);

backdrop-filter:

blur(25px);

border:

1px solid rgba(
255,
255,
255,
0.08
);

padding:28px;

border-radius:28px;

transition:.35s;

box-shadow:

0 0 25px #00ffff22;

}

.card:hover{

transform:

translateY(-10px);

box-shadow:

0 0 40px cyan;

}

.card h2{

margin-bottom:12px;

}

.subject{

opacity:.7;

margin-bottom:12px;

}

.downloads{

color:#00ffee;

margin-bottom:18px;

}

/* BUTTONS */

.buttons{

display:flex;

gap:10px;

flex-wrap:wrap;

}

.btn{

padding:12px 16px;

border:none;

border-radius:14px;

cursor:pointer;

font-weight:700;

transition:.3s;

text-decoration:none;

display:inline-block;

}

.open{

background:#00ffee22;

border:1px solid cyan;

color:cyan;

}

.download{

background:#1f9dff22;

border:1px solid #1f9dff;

color:#8fd9ff;

}

.delete{

background:#ff2d5522;

border:1px solid #ff2d55;

color:#ff89a1;

}

.btn:hover{

transform:

translateY(-4px);

}

.section{

margin-top:70px;

}

.section h3{

font-size:34px;

margin-bottom:30px;

}

.empty{

opacity:.6;

text-align:center;

padding:40px;

}

</style>

</head>

<body>

<div class="nav">

<div class="logo">

⚡ NoteShare

</div>

<div>

Browse Notes

</div>

</div>

<div class="hero">

<h1>

Your Notes ⚡

</h1>

<p>

Browse uploaded study materials

</p>

<div id="clock"></div>

<div class="search">

<input
id="search"
placeholder="🔍 Search notes..."
oninput="filterNotes()">

</div>

</div>

<div class="section">

<h3>

🔥 Trending Notes

</h3>

<div
class="notes"
id="trending">

</div>





<script>

const API =
"https://noteshare-o50k.onrender.com";

let allNotes=[];

function updateClock(){

const now=
new Date();

document
.getElementById(
"clock"
)

.innerHTML=

now.toLocaleString();

}

setInterval(
updateClock,
1000
);

updateClock();

async function getNotes(){

const res=

await fetch(
API+"/notes"
);

allNotes=

await res.json();

renderNotes(
allNotes
);

}

async function getTrending(){

try{

const res=

await fetch(
API+"/trending"
);

const data=

await res.json();

renderTrending(
data
);

}

catch{

}

}

function renderTrending(data){

const div=

document
.getElementById(
"trending"
);

div.innerHTML="";

if(!data.length){

div.innerHTML=

"<div class='empty'>No trending notes yet</div>";

return;

}

data.forEach(note=>{

div.innerHTML+=card(note);

});

}

function renderNotes(notes){

const div=

document
.getElementById(
"notes"
);

div.innerHTML="";

if(!notes.length){

div.innerHTML=

"<div class='empty'>No notes found</div>";

return;

}

notes.forEach(note=>{

div.innerHTML+=card(note);

});

}

function card(note){

return `

<div class="card">

<h2>

🔥 ${note.title}

</h2>

<div class="subject">

${note.subject}

</div>

<div class="downloads">

⬇ ${note.downloads||0}
downloads

</div>

<div class="buttons">

<a

class="btn open"

href=

"viewer.html?pdf=${encodeURIComponent(note.pdfUrl)}"

>

👁 Open

</a>

<a

class="btn download"

href="${note.pdfUrl}"

download=

"${note.fileName||note.title}"

onclick=

"downloadCount('${note._id}')"

>

📥 Download

</a>

<button

class="btn delete"

onclick=

"deleteNote('${note._id}')"

>

Delete

</button>

</div>

</div>

`;

}

function filterNotes(){

const value=

document
.getElementById(
"search"
)
.value
.toLowerCase();

const filtered=

allNotes.filter(

n=>

n.title
.toLowerCase()
.includes(value)

||

n.subject
.toLowerCase()
.includes(value)

);

renderNotes(filtered);

}

async function deleteNote(id){

await fetch(

API+

"/delete-note/"

+

id,

{

method:

"DELETE"

}

);

getNotes();

getTrending();

}

function downloadCount(id){

fetch(

API+

"/download/"

+

id,

{

method:"POST"

}

);

}

getNotes();

getTrending();

</script>

</body>

</html>
